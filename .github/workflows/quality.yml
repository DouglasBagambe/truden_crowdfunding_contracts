name: Quality

on:
  push:
    branches:
      - "keibo/**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile
        run: npm run compile
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Contract tests
        run: npm test
      - name: Coverage
        run: npm run coverage
      - name: Invariant and property tests
        run: npm run test:property
      - name: Deployed bytecode size checks
        run: npm run size
